name: One-time sensitive history scrub

on:
  push:
    branches:
      - scrub/workplace-identifiers-20261014

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare all branch refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          for b in \
            alignment/swarm-kernel-1.2.1-20261005 \
            backup/pre-scale100-align-20261005T1418 \
            control/project-holds-five-stage-20261005 \
            hardening/authority-auth-cases-20261005 \
            intercomm-optimization-v1-backup \
            main \
            voice-bootstrap-connector; do
            git branch -f "$b" "origin/$b"
          done

      - name: Install git-filter-repo
        shell: bash
        run: python -m pip install --disable-pip-version-check git-filter-repo

      - name: Remove only the identifying screenshot from all reachable history
        shell: bash
        run: |
          set -euo pipefail
          git filter-repo --force --invert-paths --path 'image (3).png'
          if git rev-list --objects --all | grep -Fq 'image (3).png'; then
            echo 'Sensitive path still reachable after rewrite.' >&2
            exit 1
          fi

      - name: Force-push rewritten branch histories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for b in \
            alignment/swarm-kernel-1.2.1-20261005 \
            backup/pre-scale100-align-20261005T1418 \
            control/project-holds-five-stage-20261005 \
            hardening/authority-auth-cases-20261005 \
            intercomm-optimization-v1-backup \
            main \
            voice-bootstrap-connector \
            scrub/workplace-identifiers-20261014; do
            git push --force origin "refs/heads/$b:refs/heads/$b"
          done

      - name: Remove this temporary workflow from the scrub branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout scrub/workplace-identifiers-20261014
          git config user.name 'history-scrub-bot'
          git config user.email 'history-scrub-bot@users.noreply.github.com'
          if [ -f .github/workflows/one-time-sensitive-history-scrub.yml ]; then
            git rm .github/workflows/one-time-sensitive-history-scrub.yml
            git commit -m 'Remove temporary sensitive-history scrub workflow'
            git push --force origin scrub/workplace-identifiers-20261014
          fi
